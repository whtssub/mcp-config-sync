[project]
name = "mcp-config-sync"
version = "0.1.0"
description = "Unified CLI manager for MCP (Model Context Protocol) configurations — write once, sync everywhere."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "keyring>=24.0.0",
    "platformdirs>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
mcp-config-sync = "mcp_sync.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
